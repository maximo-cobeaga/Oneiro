[workspace]
resolver = "2"
members = [
    "crates/oneiro-lang",
    "crates/oneiro-audio",
    "crates/oneiro-core",
    "crates/oneiro-render",
    "crates/oneiro-cli",
    "crates/oneiro-ide",
    "crates/oneiro-ai",
    "crates/oneiro-mcp",
    "crates/oneiro-voice",
    "crates/oneiro-cutter",
    "crates/oneiro-toon3d",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
