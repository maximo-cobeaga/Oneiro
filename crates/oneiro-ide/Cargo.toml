[package]
name = "oneiro-ide"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oneiro-ide"
path = "src/main.rs"

[dependencies]
oneiro-lang = { path = "../oneiro-lang" }
oneiro-core = { path = "../oneiro-core" }
oneiro-audio = { path = "../oneiro-audio", features = ["device"] }
oneiro-voice = { path = "../oneiro-voice" }
oneiro-render = { path = "../oneiro-render" }
oneiro-ai = { path = "../oneiro-ai" }
eframe = "0.37"
rfd = "0.17"
tiny-skia = "0.11"
oneiro-cutter = { path = "../oneiro-cutter" }
